# =============================================================================
# 智能体热度指数 - 运维核心配置
# 新增产品 / 榜单 / 数据源开关：改本文件即可，不需要改代码。
# 新增"数据源类型"才需要写新采集器模块（collector/sources/ 一源一模块）。
# =============================================================================

site:
  name: InferTech 观察站
  tagline: 每个数字都能溯源到原始响应的第三方智能体榜单
  lang: zh-CN

methodology:
  version: v1.8                # v1.8: FM 榜改为 AA Intelligence Index 总评分口径(SuperCLUE 停用);v1.7: Harness 核心/生态分层;v1.6: 模型榜
  observation_threshold: 0.5    # 加权覆盖率低于该值的产品进观察区，不参与排名

# =============================================================================
# 三方向频道（信息架构的唯一来源；顺序即门户与侧栏顺序）
# 方向=频道，每个频道固定「新闻流 + 榜单 + 每周总结」三区。
# 增删方向/调整板块只改这里，模板不硬编码任何方向名或板块。
#   news_tag        每周总结的分组标识（insights.tags 写 direction:<news_tag>）
#   news_categories 该方向新闻流包含的 news_items.category（空=暂无新闻，显示空态）
#   placeholder     true=方向建设中：渲染说明与 planned_sources 清单，板块显示空态
# =============================================================================
directions:
  harness:
    name: 智能体
    short: Harness
    icon: i-index
    tagline: 核心产品 + 生态项目分层
    description: 关注能自主执行、多步编排的智能体产品；核心产品与生态项目平行展示，永不混排。
    boards: [harness_core, harness_eco]
    news_tag: harness
    news_categories: [coding, framework]
    inclusion:
      title: 收录说明（核心榜三问）
      questions:
        - 面向用户可用？（有可交付的产品形态，而不只是代码库）
        - 具备自主执行或多步编排能力？（能自己完成任务，而不只是提供协议/SDK）
        - 有可采集的公开使用数据？（GitHub/npm/App Store 等至少一条可用链路）
      note: 三问全部通过才进入核心产品榜；协议（MCP）、库/框架（LangChain）、编排工具（n8n）等进入生态项目榜平行展示。原联合榜已并入核心产品榜，历史条目按产品维度逐个复核 tier。
    migration_note: 2026-10-19 迁移：coding 全部 → core；framework 全部 → eco；general/claw 逐个判定（Browser Use 为框架 → eco，其余面向用户的产品 → core）。
  fm:
    name: 模型
    short: FM
    icon: i-method
    tagline: AA 总评分 · 周更
    description: 以 Artificial Analysis Intelligence Index 总评分为准，自动收录当前主流模型（同系列取最高分版本）；SuperCLUE 已停用，历史数据仅作存档。
    boards: [model]
    news_tag: fm
    news_categories: [models, research]
  nv:
    name: 硬件
    short: NV
    icon: i-chip
    tagline: 方向建设中
    description: 推理硬件与算力基础设施方向，以空页起步，数据源接入后逐项填充。
    boards: []
    news_tag: nv
    news_categories: []
    placeholder: true
    placeholder_note: 硬件方向以空页起步，新闻/榜单/每周总结三件套骨架已就位；以下数据源接入后逐项填充。
    planned_sources:
      - {name: MLPerf, note: 训练与推理性能基准, status: 接入中}
      - {name: 厂商官方规格, note: GPU/加速卡与整机规格, status: 规划中}
      - {name: 云厂商价格页, note: 按需/预留实例价格, status: 规划中}

# ---- 历史数据 LRU 保留窗口（天）。0 = 永久保留。每次更新后执行清理 ----
retention:
  raw_body_days: 30        # 原始响应体文件（体积大头）：到期删文件、保留元数据行与 sha256
  metrics_days: 180        # 指标时序
  rankings_days: 365       # 榜单快照
  cache_hours: 48          # GitHub 采集缓存文件
  news_days: 180           # 新闻条目（与指标窗口对齐；每周 digest 页随窗口滚动）

github:
  token_env: GITHUB_TOKEN          # 可选；配置后配额 60次/时 -> 5000次/时
  cache_ttl_hours: 6               # 同一 GitHub 请求在 TTL 内复用缓存（含溯源 raw id）
  min_interval: 1.1                # 秒

http:
  timeout: 20
  min_interval: 1.05               # 对同一主机的最小请求间隔（礼貌频率）
  host_intervals:                  # 个别限流严格的源给更长间隔（实测 pypistats 3s 基本不触发 429）
    pypistats.org: 3.0
    artificialanalysis.ai: 2.0
  host_backoffs:                   # 个别源的专属退避序列（pypistats 全线 429 时不再拖满 65s/包）
    pypistats.org: [5, 15]
    artificialanalysis.ai: [3, 8]  # 免费 API 慢分页：少重试、源内用长超时
  backoff: [5, 15, 45]             # 429/5xx 与网络错误的默认退避（递增重试）

# ---- 指标定义：unit 参与展示，direction 参与分位数归一化 ----
metric_definitions:
  github_stars:             {unit: count, direction: higher}
  github_forks:             {unit: count, direction: higher}
  github_open_issues:       {unit: count, direction: lower}
  github_contributors:      {unit: count, direction: higher}
  github_commits_30d:       {unit: count, direction: higher}
  github_releases_30d:      {unit: count, direction: higher}
  github_stars_growth_30d:  {unit: pct,   direction: higher}
  npm_monthly_downloads:    {unit: count, direction: higher}
  npm_downloads_growth_30d: {unit: pct,   direction: higher}
  pypi_monthly_downloads:   {unit: count, direction: higher}
  pypi_downloads_growth_30d: {unit: pct,  direction: higher}
  appstore_rank:            {unit: rank,  direction: lower}
  appstore_rating_count:    {unit: count, direction: higher}
  appstore_rating_growth_30d: {unit: pct, direction: higher}
  vscode_installs:          {unit: count, direction: higher}
  sc_total:                 {unit: score, direction: higher}
  sc_math:                  {unit: score, direction: higher}
  sc_science:               {unit: score, direction: higher}
  sc_code:                  {unit: score, direction: higher}
  sc_agent:                 {unit: score, direction: higher}
  sc_instruction:           {unit: score, direction: higher}
  sc_hallucination:         {unit: score, direction: higher}
  # Artificial Analysis 免费 API（指数 v4.3）：九类指数，进模型榜展示列，不参与规则排名合成
  aa_intelligence:          {unit: score, direction: higher}
  aa_coding:                {unit: score, direction: higher}
  aa_agentic:               {unit: score, direction: higher}
  aa_finance:               {unit: score, direction: higher}
  aa_strategy:              {unit: score, direction: higher}
  aa_legal:                 {unit: score, direction: higher}
  aa_healthcare:            {unit: score, direction: higher}
  aa_engineering:           {unit: score, direction: higher}
  aa_economics:             {unit: score, direction: higher}

# 由历史指标推导的增长率（评分期计算，不单独存储）
derived_growth:
  github_stars_growth_30d: github_stars
  pypi_downloads_growth_30d: pypi_monthly_downloads
  vscode_installs_growth_30d: vscode_installs
  appstore_rating_growth_30d: appstore_rating_count

# =============================================================================
# 榜单与权重（权重改动必须递增 methodology.version）
# =============================================================================
boards:
  # Harness 两榜：核心产品与生态项目平行展示，永不混排（DESIGN 1.4 默认 B）。
  # 核心榜由隐藏的分类源榜（coding/general/claw）派生，只收 tier=core；
  # 生态榜按 tier=eco 选品，协议/库/编排工具只进这里。
  harness_core:
    name: 核心产品榜
    derived: true
    derived_from: [coding, general, claw]
    tier: core
  harness_eco:
    name: 生态项目榜
    folded: true                # 频道页折叠区，不占主表
    select: {tier: eco}
    heat:
      github_stars: 0.30
      pypi_monthly_downloads: 0.25
      npm_monthly_downloads: 0.20
      github_contributors: 0.15
      github_forks: 0.10
    momentum:
      github_commits_30d: 0.40
      github_stars_growth_30d: 0.30
      pypi_downloads_growth_30d: 0.15
      npm_downloads_growth_30d: 0.15
  model:
    name: 模型评测
    overlay: true               # 独立评测榜,不并入 Harness 核心榜
    # 2026-10-19 需求方决定：以 Artificial Analysis 总评分为准，SuperCLUE 停用。
    # 成员由 AA 源自动同步（origin=aa、status=active，同系列去重取最高分版本，前 40）。
    select: {origin: aa, status: active}
    display_metrics: [aa_intelligence, aa_coding, aa_agentic]
    heat:
      aa_intelligence: 1.0
    momentum:
      aa_intelligence: 1.0
  # 分类源榜：仅用于派生核心榜、观察区与产品页溯源，不单独进导航/门户
  coding:
    name: 编码智能体（源榜）
    hidden: true
    heat:
      github_stars: 0.25
      npm_monthly_downloads: 0.35
      vscode_installs: 0.20
      github_contributors: 0.10
      github_forks: 0.10
    momentum:
      github_commits_30d: 0.30
      github_releases_30d: 0.20
      github_stars_growth_30d: 0.30
      npm_downloads_growth_30d: 0.20
  general:
    name: 通用智能体（源榜）
    hidden: true
    # v1.1: 开源/闭源双轨道——GitHub 轨 0.5 / App Store 轨 0.5，
    # 任一轨道完整即可达 50% 覆盖率入榜（开源产品无 App Store 数据，反之亦然）
    heat:
      github_stars: 0.50
      appstore_rating_count: 0.25
      appstore_rank: 0.25
    momentum:
      github_commits_30d: 0.50
      github_stars_growth_30d: 0.50
  claw:
    name: Claw 生态（源榜）
    hidden: true
    heat:
      github_stars: 0.40
      npm_monthly_downloads: 0.40
      appstore_rank: 0.20
    momentum:
      github_commits_30d: 0.50
      github_stars_growth_30d: 0.30
      npm_downloads_growth_30d: 0.20
  domestic:
    name: 国产开源榜
    overlay: true               # 地域专题榜；不参与 Harness 核心榜派生，避免重复入榜
    heat:
      github_stars: 0.65
      github_forks: 0.35
    momentum:
      github_commits_30d: 0.50
      github_stars_growth_30d: 0.50
  domestic_app:
    name: 国产应用榜
    overlay: true
    heat:
      appstore_rating_count: 0.55
      appstore_rank: 0.45
    momentum:
      appstore_rating_growth_30d: 1.00
  office:
    name: 办公智能体
    enabled: false             # 暂无可用数据源（多为闭源），Phase 2 接入
  research:
    name: 研究智能体
    enabled: false
  data:
    name: 数据智能体
    enabled: false

# 旧 board_key → 新 board_key。framework 已并入 Harness 生态榜；
# 读取旧库 board_tags 时也会按此归一，避免产品页出现不存在的榜单。
board_aliases:
  framework: harness_eco

# =============================================================================
# 数据源登记表（sources 表 + /sources 页面的数据基础）
# =============================================================================
sources:
  - key: superclue
    type: superclue
    name: SuperCLUE 中文大模型月报（已停用）
    base_url: "https://www.cluebenchmarks.com/superclue_2509"
    enabled: false
    notes: 2026-10-19 需求方决定 FM 榜以 AA 总评分为准；本源停止采集，历史 raw 与 sc_* 指标保留可回查。
  - key: aa
    type: aa
    name: Artificial Analysis 模型指数
    base_url: "https://artificialanalysis.ai/api/v2/language/models/free"
    auth: required
    rate_limit: 免费层 1000 次；源内七天缓存，首次/过期才拉 4 页（周更）
    cache_days: 7
    top_n: 40                     # 同系列去重后按 Intelligence Index 取前 N 自动入池
    enabled: true
    notes: >-
      AA_API_KEY 存 data/model_eval.env（600，严禁入库）；必须用 httpx（curl 在此线路会截断）。
      FM 榜唯一排名口径：Intelligence Index 总评分；模型池自动同步，SuperCLUE 已停用。
  - key: github
    name: GitHub REST API
    type: api
    base_url: https://api.github.com
    auth: optional
    rate_limit: 未认证 60 次/小时/IP；认证 5000 次/小时
    enabled: true
    notes: 建议配置 GITHUB_TOKEN；未认证时自动降级（跳过 contributors/releases 等）
  - key: npm
    name: npm Registry Downloads API
    type: api
    base_url: https://api.npmjs.org
    auth: none
    rate_limit: 宽松
    enabled: true
    notes: 批量端点，一次请求多个包
  - key: pypi
    name: PyPI 下载量 (pypistats)
    type: api
    base_url: https://pypistats.org
    auth: none
    rate_limit: 有速率限制，已实现 5/15/45s 退避
    enabled: true
  - key: appstore_rss
    name: Apple App Store 榜单 RSS
    type: rss
    base_url: https://itunes.apple.com
    auth: none
    rate_limit: 未知
    enabled: true
    notes: 按产品所属地区采集免费总榜 Top 200；未上榜记 201+
  - key: appstore_lookup
    name: Apple 元数据 API
    type: api
    base_url: https://itunes.apple.com
    auth: none
    rate_limit: 宽松
    enabled: true
    notes: 不提供下载量，仅评分数量等
  - key: vscode
    name: VS Code Marketplace
    type: api
    base_url: https://marketplace.visualstudio.com
    auth: none
    rate_limit: 宽松
    enabled: true
    notes: POST extensionquery, flags=914
  - key: huggingface
    name: HuggingFace Hub API
    type: api
    base_url: https://huggingface.co
    auth: none
    rate_limit: 未知
    enabled: false
    notes: 2026-09-23 本机实测不可达，待网络条件变化后启用
  - key: dockerhub
    name: Docker Hub API
    type: api
    base_url: https://hub.docker.com
    auth: none
    rate_limit: 未知
    enabled: false
    notes: 2026-09-23 本机实测不可达，跳过
  - key: news_rss
    name: AI 新闻 RSS/Atom 聚合
    type: rss
    auth: none
    rate_limit: 每主机 ≥1s（http.py 统一限频）
    enabled: true
    notes: 源清单见下方 news.feeds（2026-10-09 逐源实测可达）；逐 feed 失败隔离并公示于运行日志
  - key: news_hn
    name: Hacker News（Algolia API）
    type: api
    base_url: https://hn.algolia.com/api/v1
    auth: none
    rate_limit: 宽松
    enabled: true
    notes: 按 AI agent 关键词检索 story，points_min 过滤低分噪声

# =============================================================================
# AI Agent 新闻汇总（第三个顶级功能 /news）
# 分类为确定性关键词规则（先匹配先得，无 LLM）；feed 级默认分类做兜底。
# 2026-10-09 从本机实测：HuggingFace 博客/Reddit/blog.google 超时、机器之心 RSS
# 已失效（重定向付费服务）、Anthropic 无 RSS、VentureBeat 数据中心 IP 429，
# 以上均未纳入；如需启用先复测可达性。
# =============================================================================
news:
  lookback_days: 7           # 每轮只入库最近 N 天发布的条目（防老内容回填）
  max_items_per_feed: 40     # 单 feed 单轮入库上限
  digest_weeks: 8            # 生成最近 N 个 ISO 周的周报页
  categories:
    models: 模型与能力
    framework: 框架与工具链
    coding: 编码智能体
    infra: 推理与基础设施
    product: 产品与落地
    safety: 安全与治理
    research: 研究与论文
  keyword_rules:             # 顺序即优先级：先匹配先得
    coding:
      [claude code, claude-code, codex, cursor, copilot, devin, windsurf,
       cline, aider, opencode, openhands, kilo code, goose, swe agent,
       coding agent, code agent, 编码智能体, 代码智能体, 编程助手, 代码助手, 氛围编程, vibe coding]
    framework:
      [langchain, langgraph, langflow, autogen, crewai, agent sdk,
       agents sdk, agent framework, model context protocol, mcp, dify,
       coze, 扣子, n8n, flowise, mastra, agentscope, metagpt, openmanus,
       multi-agent, multi agent, 多智能体, 智能体框架, 编排, orchestration, agentic]
    models:
      [gpt-, chatgpt, o1, o3, o4, claude, gemini, deepseek, llama, qwen,
       千问, mistral, kimi, glm, grok, 豆包, 模型发布, 新模型, 开源模型, 大模型,
       foundation model, frontier model, reasoning model, 推理模型, 多模态,
       multimodal, long context, 长上下文, 强化学习, reinforcement learning]
    infra:
      [vllm, sglang, tensorrt, triton, gpu, h100, b200, blackwell, cuda,
       推理成本, 推理优化, inference, serving, kv cache, kv-cache, 量化,
       quantization, 蒸馏, distill, 吞吐, throughput, 训练, training, 微调,
       fine-tun, 算力, 数据中心, inference infra, llamafile, ollama]
    safety:
      [安全漏洞, 沙箱, sandbox, 提示注入, prompt injection, jailbreak, 越狱,
       治理, governance, 监管, regulation, ai act, owasp, red team, 红队,
       alignment, 对齐, 隐私, privacy, 安全风险, agent security, 权限管控]
    research:
      [arxiv, 论文, paper, benchmark, swe-bench, agentbench, gaia, tau-bench,
       evaluation, 评测, survey, 综述, 研究者, 突破, researchers]
    product:                  # 兜底类：也配少量词，未命中任何规则时落到 feed 默认分类
      [融资, funding, 收购, acquisition, 估值, valuation, 发布会, 定价, pricing,
       enterprise, 企业级, 落地, 上线, generally available, partnership, 合作]
  feeds:
    - {key: news_openai,  name: OpenAI News,        category: models,   region: global, enabled: true,
       url: "https://openai.com/news/rss.xml"}
    - {key: news_techcrunch, name: TechCrunch AI,   category: product,  region: global, enabled: true,
       url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
    - {key: news_verge,   name: The Verge AI,       category: product,  region: global, enabled: true,
       url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"}
    - {key: news_mittr,   name: MIT Tech Review AI, category: product,  region: global, enabled: true,
       url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"}
    - {key: news_mtp,     name: MarkTechPost,      category: research, region: global, enabled: true,
       url: "https://www.marktechpost.com/feed/"}
    - {key: news_simonw,  name: Simon Willison,    category: framework, region: global, enabled: true,
       url: "https://simonwillison.net/atom/everything/"}
    - {key: news_latent,  name: Latent.Space,      category: infra,    region: global, enabled: true,
       url: "https://www.latent.space/feed"}
    - {key: news_arxiv,   name: ArXiv（agent 论文）, category: research, region: global, enabled: true,
       url: "https://export.arxiv.org/api/query?search_query=all:%22AI+agent%22+OR+all:%22LLM+agent%22&sortBy=submittedDate&sortOrder=descending&max_results=25"}
    - {key: news_qbitai,  name: 量子位,             category: models,   region: cn, enabled: true,
       url: "https://www.qbitai.com/feed"}
    - {key: news_infoq,   name: InfoQ 中国,         category: infra,    region: cn, enabled: true,
       url: "https://www.infoq.cn/feed"}
  hn:
    points_min: 3
    hits_per_query: 30
    queries:
      - {q: "AI agent",     category: product}
      - {q: "LLM agent",    category: framework}
      - {q: "MCP server",   category: framework}
      - {q: "Claude Code",  category: coding}
      - {q: "coding agent", category: coding}

# =============================================================================
# 产品清单（种子来自开发规范 15.1，2026-09-23 验证存在）
# integration 字段为初始人工录入（保守填写），接入适配度详情见 /methodology
# =============================================================================
products:
  # ---------- coding ----------
  - slug: codex-cli
    name: Codex CLI
    vendor: OpenAI
    category: coding
    tier: core
    repo: openai/codex
    npm_package: "@openai/codex"
    license: Apache-2.0
    integration: {has_cli: 1, has_tui: 1, has_api: 1, protocol: [openai-compat], install_difficulty: easy}
  - slug: dsh
    name: DSH (DeepSeek Harness)
    vendor: DeepSeek
    category: coding
    tier: core
    board_tags: [coding, domestic]
