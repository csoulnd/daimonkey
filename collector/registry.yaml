assistant:
  enabled: true
  # PIAgent 一次性进程模式(pi.dev,collector/piagent.py):任务期间起 pi 子进程、
  # 用完即退(实测峰值 ~130MB),无常驻 runtime。--no-tools 全禁工具。
  provider: deepseek
  model: deepseek/deepseek-flash     # pi 模型目录里的 provider/model 标识
  api_key_env: DEEPSEEK_API_KEY
  thinking: low                      # 推理档位 off/minimal/low/medium/high,低档省 token
  execution:
    max_concurrent: 1               # 全局并发（跨进程文件锁强制）
    timeout_s: 300                  # 超时即杀 pi 进程组（兼作输出预算上限）
  internal:
    daily_limit: 50
    daily_tokens: 1000000
    queue_depth: 3
  interactive:
    daily_limit: 100
    daily_tokens: 2000000
    max_message_chars: 8000
    max_output_tokens: 4000
  login:
    max_failures: 5
    lockout_minutes: 10
  sessions:
    active_days: 7                  # 会话下拉只显示近 N 天活跃会话（历史不删，仅不列出）
  # AI 接入（v1.4）：页面摘要随数据刷新自动生成（指纹去重）；AI 分析分平行存储。
  ai:
    summaries:
      enabled: true
      pages: [home, knowledge, board]   # 全站新闻页已下线(2026-10-19),新闻总结改由各方向周总结承担
      max_tokens: 3000             # 推理+输出总预算（过小会出现 max-tokens 空回复）
    scoring:
      enabled: true
      boards: []                    # 空 = 自动取当日有数据的所有榜；可填 [harness_core, harness_eco]
      top_n: 15                     # 每榜取前 N 名送 AI 分析
      max_tokens: 4000
      ai_weight: 0.3                # AI 复评在核心榜最终分中的权重(v1.5);0=仅展示
    # 方向周总结（M4）：按 directions.news_categories 过滤；生成后可直接发布，
    # 人工可用 scripts/digestctl.py edit/publish 修改。publish=false 则先落草稿。
    direction_digests:
      enabled: true
      publish: true
      max_tokens: 1200

# 云剪贴板（个人工作台，2026-10-19）：两台设备间文本同步 + 小云盘。
# 用户隔离按 owner；文件落 data/clipboard/{owner}/，换机备份见 deploy/backup.sh 白名单。
clipboard:
  max_text_bytes: 65536             # 单条文本上限（64KB，与请求体上限一致）
  max_file_bytes: 104857600         # 单文件上限（100MB）
  quota_mb: 1024                    # 每用户文件总配额（1GB，只统计文件不统计文本）
  keep_text_items: 100              # 文本条目滚动保留最近 N 条（旧的自动清理）
