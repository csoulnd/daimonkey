{% extends "base.html" %}
{% block title %}智能助手 · {{ site.name }}{% endblock %}
{% block content %}
<div class="assistant-wrap">
  <h1>智能助手</h1>
  <p class="dim">DSH agent loop 驱动 · 单用户登录 · 用量受每日配额限制，AI 产物均带标记、与确定性数据隔离。</p>

  <!-- 登录视图 -->
  <section id="asst-login" hidden>
    <div class="asst-card">
      <label for="asst-password">密码（与「更新数据」按钮同一密码）</label>
      <input type="password" id="asst-password" autocomplete="current-password"
             placeholder="输入密码" maxlength="128">
      <button id="asst-login-btn" type="button">登录</button>
      <p class="asst-msg" id="asst-login-msg"></p>
    </div>
  </section>

  <!-- 主视图 -->
  <section id="asst-app" hidden>
    <div class="asst-columns">
      <div class="asst-side">
        <button id="asst-new" type="button">＋ 新会话</button>
        <ul id="asst-sessions" class="asst-session-list"></ul>
        <div class="asst-usage" id="asst-usage"></div>
      </div>
      <div class="asst-main">
        <div id="asst-workflows" class="asst-workflows"></div>
        <div id="asst-messages" class="asst-messages" aria-live="polite"></div>
        <form id="asst-form" class="asst-form">
          <textarea id="asst-input" rows="3" maxlength="8000"
                    placeholder="输入消息，Ctrl+Enter 发送"></textarea>
          <button id="asst-send" type="submit">发送</button>
        </form>
        <p class="asst-msg" id="asst-msg"></p>
      </div>
    </div>
  </section>
</div>
{% endblock %}
