<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · {{ site.name }}</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||(!t&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
<link rel="stylesheet" href="/assets/style.css?v={{ assets_v }}">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <h1>{{ site.name }}</h1>
    <div class="sub">登录后可使用:数据更新、智能助手、报告厅与个人知识库。匿名访客可浏览公开页面。</div>
    <label for="login-user">用户名</label>
    <input type="text" id="login-user" name="username" maxlength="32" autocomplete="username" required>
    <label for="login-pass">密码</label>
    <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">登 录</button>
    <div class="login-msg" id="login-msg" aria-live="polite"></div>
    <div class="login-alt"><a href="/">← 返回首页</a><span id="login-state" style="float:right"></span></div>
  </form>
</div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("login-form");
  var msg = document.getElementById("login-msg");
  var btn = document.getElementById("login-btn");
  function qs(name) {
    try { return new URLSearchParams(location.search).get(name) || "/"; } catch (e) { return "/"; }
  }
  var next = qs("next");
  if (next.charAt(0) !== "/") next = "/";
  fetch("/api/v1/assistant/session", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (s && s.authed) {
        document.getElementById("login-state").textContent =
          "已登录:" + (s.user || "") + " →";
        msg.textContent = "你已登录,提交将刷新登录态并跳转。";
        msg.style.color = "var(--dim)";
      }
    }).catch(function () { /* 忽略 */ });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    msg.textContent = "";
    btn.disabled = true;
    fetch("/api/v1/assistant/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("login-user").value.trim(),
        password: document.getElementById("login-pass").value
      })
    }).then(function (r) {
      if (r.ok) {
        try {
          localStorage.setItem("authed", "1");
          localStorage.setItem("authuser",
            document.getElementById("login-user").value.trim());
        } catch (e) { /* 忽略 */ }
        location.href = next;
        return;
      }
      btn.disabled = false;
      if (r.status === 429) msg.textContent = "尝试次数过多,已临时锁定,请稍后再试";
      else msg.textContent = "用户名或密码错误";
    }).catch(function () {
      btn.disabled = false;
      msg.textContent = "网络错误,请稍后再试";
    });
  });
})();
</script>
</body>
</html>
