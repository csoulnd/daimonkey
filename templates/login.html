<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · {{ site.name }}</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||(!t&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
<link rel="stylesheet" href="/assets/style.css?v={{ assets_v }}">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="sprite-defs" aria-hidden="true" focusable="false">
  <symbol id="i-monkey" viewBox="0 0 640 520"><path fill="currentColor" fill-rule="evenodd" d="M142 206 C159 145 207 103 267 86 C298 67 334 39 363 43 C389 47 387 69 367 87 C441 91 486 133 502 206 C548 194 591 224 591 269 C591 314 556 343 512 338 C500 409 449 454 377 454 H267 C194 454 141 409 128 338 C85 344 49 314 49 269 C49 226 91 195 142 206 Z M320 237 C291 198 247 187 207 207 C168 226 158 264 158 311 C158 366 178 397 227 402 C247 404 266 404 282 402 C291 401 294 393 294 384 V339 C294 316 304 303 320 303 C336 303 346 316 346 339 V384 C346 393 349 401 358 402 C374 404 393 404 413 402 C462 397 482 366 482 311 C482 264 472 226 433 207 C393 187 349 198 320 237 Z"/><circle cx="240" cy="298" r="18" class="eye"/><circle cx="400" cy="298" r="18" class="eye"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 12H4.8M10.5 5.8 4.3 12l6.2 6.2"/>
  </symbol>
</svg>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <svg class="login-mk" aria-hidden="true"><use href="#i-monkey"/></svg>
    <h1>{{ site.name }}</h1>
    <div class="sub">登录后可使用:数据更新、智能助手、报告厅与个人知识库。匿名访客可浏览公开页面。</div>
    <label for="login-user">用户名</label>
    <input type="text" id="login-user" name="username" maxlength="32" autocomplete="username" required>
    <label for="login-pass">密码</label>
    <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">登 录</button>
    <div class="login-msg" id="login-msg" aria-live="polite"></div>
    <div class="login-alt"><a href="/"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg> 返回首页</a><span id="login-state" style="float:right"></span></div>
  </form>
</div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("login-form");
  var msg = document.getElementById("login-msg");
  var btn = document.getElementById("login-btn");
  function qs(name) {
    try { return new URLSearchParams(location.search).get(name) || "/"; } catch (e) { return "/"; }
  }
  var next = qs("next");
  if (next.charAt(0) !== "/") next = "/";
  fetch("/api/v1/assistant/session", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (s && s.authed) {
        document.getElementById("login-state").textContent =
          "已登录:" + (s.user || "") + " →";
        msg.textContent = "你已登录,提交将刷新登录态并跳转。";
        msg.style.color = "var(--dim)";
      }
    }).catch(function () { /* 忽略 */ });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    msg.textContent = "";
    btn.disabled = true;
    fetch("/api/v1/assistant/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("login-user").value.trim(),
        password: document.getElementById("login-pass").value
      })
    }).then(function (r) {
      if (r.ok) {
        try {
          localStorage.setItem("authed", "1");
          localStorage.setItem("authuser",
            document.getElementById("login-user").value.trim());
        } catch (e) { /* 忽略 */ }
        location.href = next;
        return;
      }
      btn.disabled = false;
      if (r.status === 429) msg.textContent = "尝试次数过多,已临时锁定,请稍后再试";
      else msg.textContent = "用户名或密码错误";
    }).catch(function () {
      btn.disabled = false;
      msg.textContent = "网络错误,请稍后再试";
    });
  });
})();
</script>
</body>
</html>
