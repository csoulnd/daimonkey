<!doctype html>
<html lang="{{ site.lang|default('zh-CN', true) }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark light">
<title>页面不存在 · {{ site.name|default('InferTech 观察站', true) }}</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>try{
  if(localStorage.getItem("side")==="closed")document.documentElement.classList.add("no-side");
  var t=localStorage.getItem("theme");
  if(t==="light"||(!t&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light";
}catch(e){}</script>
<link rel="stylesheet" href="/assets/style.css{% if assets_v %}?v={{ assets_v }}{% endif %}">
<link rel="stylesheet" href="/assets/search.css{% if assets_v %}?v={{ assets_v }}{% endif %}">
<style>
  .nf-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 20px;text-align:center;gap:18px}
  .nf-brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink,#ececf4);
    font-weight:700;letter-spacing:.02em;text-decoration:none}
  .nf-brand img{width:34px;height:34px;border-radius:9px}
  .nf-code{font-family:var(--mono,ui-monospace,monospace);font-size:clamp(72px,16vw,132px);
    line-height:1;font-weight:800;letter-spacing:-.04em;margin:10px 0 0;
    background:var(--grad,linear-gradient(90deg,#7c8cff,#4fd6c4));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .nf-title{font-size:var(--fs-lg,1.4rem);margin:0;color:var(--ink,#ececf4)}
  .nf-text{max-width:560px;margin:0;color:var(--dim,#8b8b9e);line-height:1.85}
  .nf-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .nf-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--r-full,999px);
    border:1px solid var(--line-strong,#32324a);background:var(--panel2,#171724);
    color:var(--ink,#ececf4);font:inherit;font-size:var(--fs-sm,.875rem);cursor:pointer;text-decoration:none}
  .nf-btn:hover{border-color:var(--acc,#7c8cff);color:var(--acc,#7c8cff);text-decoration:none}
  .nf-btn.primary{background:var(--acc,#7c8cff);border-color:var(--acc,#7c8cff);color:var(--acc-ink,#0a0a10);font-weight:600}
  .nf-btn.primary:hover{filter:brightness(1.06);color:var(--acc-ink,#0a0a10)}
  .nf-kbd{margin-top:14px;color:var(--dim,#8b8b9e);font-size:var(--fs-xs,.75rem)}
  .nf-kbd kbd{display:inline-block;min-width:1.6em;padding:1px 6px;border:1px solid var(--line-strong,#32324a);
    border-radius:5px;background:var(--code-bg,#14141e);font-family:var(--mono,monospace);font-size:.72rem}
  .nf-links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px;
    color:var(--dim,#8b8b9e);font-size:var(--fs-sm,.875rem)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="nf-wrap">
  <a class="nf-brand" href="/" aria-label="{{ site.name|default('InferTech 观察站', true) }} · 返回首页">
    <img src="/assets/daimonkey-color.svg" alt="" width="34" height="34">
    {{ site.name|default('InferTech 观察站', true) }}
  </a>
  <p class="nf-code" aria-hidden="true">404</p>
  <h1 class="nf-title">这个页面不存在或已经下线</h1>
  <p class="nf-text">
    链接可能已过期、拼写有误，或该条目已并入新的方向频道。你可以返回首页，
    也可以直接搜索产品、榜单、方向频道与新闻。
  </p>
  <div class="nf-actions">
    <a class="nf-btn primary" href="/">← 返回首页</a>
    <button class="nf-btn" id="search-open" type="button" aria-haspopup="dialog">
      ⌕ 搜索本站
    </button>
  </div>
  <p class="nf-kbd"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>K</kbd> 随时唤起搜索</p>
  <nav class="nf-links" aria-label="常用入口">
    <a href="/sources">数据源</a>
    <a href="/api">开放 API</a>
    <a href="/dir/harness">智能体频道</a>
    <a href="/dir/fm">模型频道</a>
    <a href="/dir/nv">硬件频道</a>
  </nav>
</main>
<div id="search-root"></div>
<script src="/assets/search.js{% if assets_v %}?v={{ assets_v }}{% endif %}" defer></script>
</body>
</html>
