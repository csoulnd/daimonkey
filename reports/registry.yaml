# 报告厅清单：新增报告 = 建目录 reports/{slug}/ + 此处登记一条。
#
# 字段：
#   slug       必填，唯一标识（URL 为 /reports/{slug}）
#   title      必填，报告标题
#   date       必填，YYYY-MM-DD（列表按此倒序）
#   file       选填，内容文件名；缺省按 report.md → index.html → report.html → deck.pptx
#              探测。支持 .md（站内渲染）/ .html（原样网页嵌入）/ .pptx（原件下载）
#              目录含 showcase.yaml 时为「调研展示」：内容在构建时从知识库快照导入
#   summary    选填，一句话摘要（列表与详情页展示）
#   tags       选填，标签列表
#   materials  选填，参考材料（知识库笔记路径 / 链接等），详情页展示为"参考材料"
#
# 登记后运行一次建站即可发布（任意更新按钮或 --build）。
reports:
  - slug: ai-coding-efficiency
    title: AI Coding 提效实践：工作流与人的成长
    date: 2026-10-13
    file: index.html
    summary: 10 屏、10–15 分钟的实践分享：任务内提效、部署 skill、真实验收，以及人的学习与成长。
    tags: [AI Coding, 实践分享, 工作流, 学习]
    materials:
    - https://github.com/csoulnd/InferTechNote/blob/c61e29bd7f79e2f6097687a3adcee65c1ba0789a/agent/reports/ai-coding-workflow-practice.md
  - slug: agentcore-platforms
    title: AgentCore 平台汇报
    date: 2026-10-12
    summary: 第一章 · 阿里云 AgentCore 平台定义；第二章 · Amazon Bedrock AgentCore 七大核心能力（均为官方口径，两产品各自独立）。附 2026-10-09 原始演示文稿。
    tags: [汇报, AgentCore, 官方口径]
  - slug: hello-report
    title: 报告厅框架示例
    date: 2026-10-12
    file: report.md
    summary: 用于验证报告厅渲染链路的示例报告，可在熟悉后删除。
    tags: [示例, 框架]
