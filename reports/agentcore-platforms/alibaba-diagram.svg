<svg id="sc-diagram" viewBox="0 0 880 590" role="img" aria-label="阿里云 AgentCore 研究视图：渠道 → Agent Endpoint → 托管实例与 Session → QwenPaw/Qoder 或自定义应用 → 模型、Skill/MCP 与存储；Workspace 与 Team 经 Agent 定义施加配置与管理；AgentLoop 观测采集执行轨迹">
  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="sc-arrow"></path>
    </marker>
  </defs>

  <!-- 接入层 -->
  <g class="sc-node" data-node="caller">
    <rect x="30" y="40" width="150" height="52" rx="9"></rect>
    <text x="105" y="71">业务应用或 IM 渠道</text>
  </g>
  <g class="sc-node" data-node="endpoint">
    <rect x="250" y="40" width="190" height="52" rx="9"></rect>
    <text x="345" y="71">Agent Endpoint</text>
  </g>
  <path class="sc-edge" d="M 180 66 H 244" marker-end="url(#sc-arr)"></path>

  <!-- 管理与定义（控制面） -->
  <g class="sc-node" data-node="workspace">
    <rect x="470" y="30" width="175" height="50" rx="9"></rect>
    <text x="557" y="60">Workspace 资源管理</text>
  </g>
  <g class="sc-node" data-node="team">
    <rect x="665" y="30" width="185" height="50" rx="9"></rect>
    <text x="757" y="60">Team 协作</text>
  </g>
  <g class="sc-node" data-node="agent">
    <rect x="555" y="126" width="200" height="54" rx="9"></rect>
    <text x="655" y="158">Agent 定义</text>
  </g>
  <path class="sc-edge-soft" d="M 557 80 V 104 H 610 V 120" marker-end="url(#sc-arr)"></path>
  <text class="sc-sub" x="521" y="100">配置与授权</text>
  <path class="sc-edge-soft" d="M 757 80 V 120" marker-end="url(#sc-arr)"></path>
  <text class="sc-sub" x="790" y="100">任务与组织</text>

  <!-- 运行（执行面） -->
  <g class="sc-node" data-node="runtime">
    <rect x="225" y="190" width="240" height="56" rx="9"></rect>
    <text x="345" y="223">托管实例与 Session</text>
  </g>
  <path class="sc-edge" d="M 345 92 V 184" marker-end="url(#sc-arr)"></path>
  <path class="sc-edge-soft" d="M 555 158 H 505 V 218 H 471" marker-end="url(#sc-arr)"></path>
  <text class="sc-sub" x="516" y="180">运行配置</text>

  <g class="sc-node" data-node="harness">
    <rect x="225" y="330" width="240" height="58" rx="9"></rect>
    <text x="345" y="356">QwenPaw / Qoder</text>
    <text class="sc-sub" x="345" y="376">或自定义应用（高代码）</text>
  </g>
  <path class="sc-edge" d="M 345 246 V 324" marker-end="url(#sc-arr)"></path>

  <!-- 能力与资源 -->
  <g class="sc-node" data-node="model">
    <rect x="90" y="470" width="210" height="54" rx="9"></rect>
    <text x="195" y="502">模型连接与模型</text>
  </g>
  <g class="sc-node" data-node="skills">
    <rect x="350" y="470" width="190" height="54" rx="9"></rect>
    <text x="445" y="502">Skill 与 MCP 工具</text>
  </g>
  <g class="sc-node" data-node="storage">
    <rect x="590" y="470" width="200" height="54" rx="9"></rect>
    <text x="690" y="502">工作目录与 OSS</text>
  </g>
  <path class="sc-edge" d="M 275 388 V 430 H 195 V 464" marker-end="url(#sc-arr)"></path>
  <path class="sc-edge" d="M 345 388 V 464" marker-end="url(#sc-arr)"></path>
  <path class="sc-edge" d="M 415 388 V 430 H 690 V 464" marker-end="url(#sc-arr)"></path>

  <!-- 横向观测 -->
  <g class="sc-node sc-side" data-node="observability">
    <rect x="670" y="190" width="180" height="56" rx="9"></rect>
    <text x="760" y="214">AgentLoop 观测</text>
    <text class="sc-sub" x="760" y="234">执行轨迹</text>
  </g>
  <path class="sc-edge-soft" d="M 664 218 H 471" marker-end="url(#sc-arr)"></path>
</svg>
