<svg id="sc-diagram" viewBox="0 0 880 580" role="img" aria-label="Amazon Bedrock AgentCore 研究视图：调用方 → Runtime Endpoint → 托管运行环境（Harness 或用户代码）→ 模型与工具服务；Identity/Policy 与 Observability 为横向治理">
  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="sc-arrow"></path>
    </marker>
  </defs>

  <!-- 调用入口 -->
  <g class="sc-node" data-node="caller">
    <rect x="30" y="40" width="150" height="52" rx="9"></rect>
    <text x="105" y="71">业务调用方</text>
  </g>
  <g class="sc-node" data-node="endpoint">
    <rect x="250" y="40" width="230" height="52" rx="9"></rect>
    <text x="365" y="71">Runtime Endpoint · 入站身份</text>
  </g>
  <path class="sc-edge" d="M 180 66 H 244" marker-end="url(#sc-arr)"></path>

  <!-- 运行环境（容器） -->
  <g class="sc-node sc-container" data-node="runtime">
    <rect x="190" y="130" width="470" height="150" rx="12"></rect>
    <text class="sc-container-label" x="210" y="156">托管运行环境（Runtime）· 会话与运行生命周期</text>
  </g>
  <g class="sc-node" data-node="harness">
    <rect x="215" y="176" width="195" height="76" rx="9"></rect>
    <text x="312" y="209">托管 Harness</text>
    <text class="sc-sub" x="312" y="230">Strands 循环</text>
  </g>
  <g class="sc-node" data-node="userapp">
    <rect x="440" y="176" width="195" height="76" rx="9"></rect>
    <text x="537" y="209">用户 Agent 代码</text>
    <text class="sc-sub" x="537" y="230">自选框架 / 业务逻辑</text>
  </g>
  <path class="sc-edge" d="M 365 92 V 124" marker-end="url(#sc-arr)"></path>

  <!-- 执行路径：Harness / 用户代码 → 模型、工具 -->
  <path class="sc-edge" d="M 312 252 V 300 H 205 V 344" marker-end="url(#sc-arr)"></path>
  <path class="sc-edge" d="M 537 252 V 300 H 640 V 344" marker-end="url(#sc-arr)"></path>
  <path class="sc-edge sc-edge-soft" d="M 410 214 H 434" marker-end="url(#sc-arr)"></path>

  <g class="sc-node" data-node="model">
    <rect x="90" y="350" width="230" height="58" rx="9"></rect>
    <text x="205" y="385">模型服务</text>
  </g>
  <g class="sc-node" data-node="tools">
    <rect x="560" y="350" width="230" height="58" rx="9"></rect>
    <text x="675" y="385">工具与记忆服务</text>
  </g>
  <g class="sc-node" data-node="gateway">
    <rect x="470" y="460" width="230" height="72" rx="9"></rect>
    <text x="585" y="490">Gateway · Browser · Code Interpreter · Memory</text>
    <text class="sc-sub" x="585" y="512">按需调用，不要求调用全部模块</text>
  </g>
  <path class="sc-edge" d="M 675 408 V 454" marker-end="url(#sc-arr)"></path>

  <!-- 横向治理 -->
  <g class="sc-node sc-side" data-node="identity">
    <rect x="725" y="460" width="125" height="72" rx="9"></rect>
    <text x="787" y="490">Identity / Policy</text>
    <text class="sc-sub" x="787" y="510">权限治理</text>
  </g>
  <path class="sc-edge-soft" d="M 719 496 H 706" marker-end="url(#sc-arr)"></path>
  <g class="sc-node sc-side" data-node="observability">
    <rect x="725" y="170" width="125" height="72" rx="9"></rect>
    <text x="787" y="200">Observability</text>
    <text class="sc-sub" x="787" y="220">Evaluations · 采集评估</text>
  </g>
  <path class="sc-edge-soft" d="M 719 206 H 666" marker-end="url(#sc-arr)"></path>
</svg>
