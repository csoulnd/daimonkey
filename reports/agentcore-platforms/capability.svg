<svg id="sc-diagram" viewBox="0 0 880 640" role="img" aria-label="平台核心能力七层模型：产品接入、定义与资产、Harness 与编排、工具与上下文、运行基础设施、状态与恢复六层纵向叠放，治理与运营横跨各层；底部为不属于平台本体的外部依赖">
  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="sc-arrow"></path>
    </marker>
  </defs>

  <g class="sc-node sc-layer" data-node="access">
    <rect x="40" y="34" width="590" height="62" rx="10"></rect>
    <text class="sc-layer-name" x="60" y="62">① 产品接入</text>
    <text class="sc-sub sc-layer-sub" x="60" y="84">谁能调用 Agent，如何接入业务渠道 ｜ 阿里云：Endpoint·渠道连接器　Amazon：Runtime Endpoint</text>
  </g>
  <g class="sc-node sc-layer" data-node="assets">
    <rect x="40" y="110" width="590" height="62" rx="10"></rect>
    <text class="sc-layer-name" x="60" y="138">② 定义与资产</text>
    <text class="sc-sub sc-layer-sub" x="60" y="160">定义／工具／技能／模型如何复用与版本化 ｜ 阿里云：Workspace 资产　Amazon：服务配置与 Registry</text>
  </g>
  <g class="sc-node sc-layer" data-node="orchestration">
    <rect x="40" y="186" width="590" height="62" rx="10"></rect>
    <text class="sc-layer-name" x="60" y="214">③ Harness 与编排</text>
    <text class="sc-sub sc-layer-sub" x="60" y="236">谁控制循环、子任务、流程与审批 ｜ 阿里云：QwenPaw／Qoder　Amazon：Harness（Strands）</text>
  </g>
  <g class="sc-node sc-layer" data-node="tools">
    <rect x="40" y="262" width="590" height="62" rx="10"></rect>
    <text class="sc-layer-name" x="60" y="290">④ 工具与上下文</text>
    <text class="sc-sub sc-layer-sub" x="60" y="312">模型、知识、记忆与业务动作如何接入 ｜ 阿里云：Skill／MCP／记忆　Amazon：Gateway／Memory</text>
  </g>
  <g class="sc-node sc-layer" data-node="runtime">
    <rect x="40" y="338" width="590" height="62" rx="10"></rect>
    <text class="sc-layer-name" x="60" y="366">⑤ 运行基础设施</text>
    <text class="sc-sub sc-layer-sub" x="60" y="388">隔离、容量、网络与生命周期 ｜ 阿里云：实例／Session　Amazon：Runtime（microVM／Instances）</text>
  </g>
  <g class="sc-node sc-layer" data-node="state">
    <rect x="40" y="414" width="590" height="62" rx="10"></rect>
    <text class="sc-layer-name" x="60" y="442">⑥ 状态与恢复</text>
    <text class="sc-sub sc-layer-sub" x="60" y="464">恢复什么、哪些动作会重跑 ｜ 阿里云：历史备份／工作文件　Amazon：文件系统持久化／Memory</text>
  </g>

  <g class="sc-node sc-side sc-govern" data-node="governance">
    <rect x="660" y="34" width="180" height="442" rx="10"></rect>
    <text x="750" y="228">治理与运营</text>
    <text class="sc-sub" x="750" y="252">身份 · 权限 · 质量</text>
    <text class="sc-sub" x="750" y="272">发布 · 审计 · 费用</text>
    <text class="sc-sub" x="750" y="292">横跨各层</text>
    <text class="sc-sub" x="750" y="330">阿里云：权限／Trace</text>
    <text class="sc-sub" x="750" y="350">Amazon：Identity／Policy</text>
    <text class="sc-sub" x="750" y="370">/ Observability</text>
  </g>

  <g class="sc-external">
    <rect x="40" y="510" width="800" height="88" rx="10"></rect>
    <text x="440" y="542">外部依赖（不属于平台本体，需单独设计）</text>
    <text class="sc-sub" x="440" y="570">模型推理基础设施 · 企业业务系统 · 知识摄取管道</text>
  </g>
</svg>
