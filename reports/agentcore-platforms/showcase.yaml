  sources_folds:           # 参考来源折叠表（调研文档的原始来源清单）
    - {label: "阿里云来源表（A1–A6）", from: alibaba_detail, heading: 参考来源}
    - {label: "Amazon 来源表（B1–B8）", from: amazon_detail, heading: 参考来源}

  overview:
    title: 报告摘要
    points: []             # 待撰写（按两章定稿后补）

  chapters:
    - id: ch-a
      num: "一"
      title: 阿里云 AgentCore
      gist: 智能体构建和治理平台
      lead: 先看阿里云 AgentCore 是什么。
      points:
        - text: "定义为**智能体构建和治理平台**：企业可以创建、接入和统一管理智能体。"
          kind: fact
          anchor: alibaba_definition#官方定义
        - text: "以「**统一构建、统一纳管、统一治理**」组织平台能力；核心理念 **Agent = Model + Harness**。"
          kind: fact
          anchor: alibaba_definition#官方定义
        - text: "**平台、执行引擎与模型入口是三件事**：AgentCore 是平台；QwenPaw／Qoder 是托管 Harness 的执行引擎；模型连接提供模型访问配置。"
          kind: fact
          anchor: alibaba_definition#概念与边界
      sections:
        - {id: a-def, title: 它是什么, from: alibaba_definition, heading: 官方定义}
        - {id: a-audience, title: 面向谁, from: alibaba_definition, heading: 面向谁}
        - {id: a-concepts, title: 概念与边界, from: alibaba_definition, heading: 概念与边界}
        - {id: a-access, title: 接入路径, from: alibaba_definition, heading: 接入路径}

    - id: ch-b
      num: "二"
      title: Amazon Bedrock AgentCore
      gist: 可组合的能力体系
      lead: 再看 Amazon Bedrock AgentCore——能力体系由七项核心服务组成。
      points:
        - text: "架构由**七项核心能力**组成：Runtime、Memory、Identity、Gateway、Code Interpreter、Browser Tool、Observability。"
          kind: fact
          anchor: amazon_capabilities#七大核心能力
        - text: "七项服务**既可单独使用，也可协同工作**；兼容开源或自定义 Agent 框架。"
          kind: fact
          anchor: amazon_capabilities#组合方式
        - text: "通过 **AgentCore SDK** 集成到现有代码；支持托管于 Amazon Bedrock 或其他服务的任意框架和模型。"
          kind: fact
          anchor: amazon_capabilities#组合方式
      sections:
        - {id: b-caps, title: 七大核心能力, from: amazon_capabilities, heading: 七大核心能力}
        - {id: b-compose, title: 组合方式, from: amazon_capabilities, heading: 组合方式}
