#     doc_urls 指向官方原文；调研文档仍作为背景来源保留在 docs。
# 素材文档（sources/）为"更新文档"环节产出：来自官方口径的整理稿，进 git 可回溯。
showcase:
  title: AgentCore 平台汇报

