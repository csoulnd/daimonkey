showcase:
  title: 从定义理解 AgentCore
  subtitle: 阿里云：从平台对象走向操作界面 · Amazon：从服务原语走向系统架构
  notes: notes.md
  docs:
    alibaba_detail: agent/investigations/products/alibaba-agentcore/detail.md
    amazon_detail: agent/investigations/products/amazon-agentcore/detail.md
  overview:
    title: 两个同名产品，两种理解入口
    points:
    - text: '**阿里云**：智能体构建和治理平台。从 Workspace、Agent 和资产绑定理解统一管理。'
      kind: fact
      anchor: alibaba_detail#研究背景与结论
    - text: '**Amazon**：可组合的 Agent 构建与运行平台。从 Runtime、Harness 和平台服务理解执行责任。'
      kind: fact
      anchor: amazon_detail#结论与研究范围
  diagrams:
    aws:
      file: diagram.svg
      caption: 执行关系 · 点步骤追踪一次调用
      doc_note: 依据公开职责重构的研究视图，不表示 AWS 内部部署拓扑；服务按需选择。
      desc_table_from: amazon_detail
      components: []
  chapters:
  - id: ch-a
    num: 一
    title: 阿里云 AgentCore
    gist: 从定义到平台能力
    lead: 先识别平台、执行引擎和模型入口，再沿着创建、绑定、运行、治理的操作路径理解它。
    sections:
    - id: a-definition
      title: 01 / 定义：它统一了什么
      from: alibaba_detail
      heading: 研究背景与结论
    - id: a-boundary
      title: 02 / 入口：三种 Agent 接入模式
      from: alibaba_detail
      heading: 产品边界
    - id: a-objects
      title: 03 / 对象：Workspace → Agent → 实例 → Session
      from: alibaba_detail
      heading: 关键对象关系
    - id: a-host
      title: 04 / 托管：平台承担哪些运行责任
      from: alibaba_detail
      heading: 托管运行的责任
  - id: ch-b
    num: 二
    title: Amazon Bedrock AgentCore
    gist: 从定义到系统架构
    lead: 从执行循环与运行环境的分工入手；把初始七项服务与完整系统的七个分析维度分开理解。
    sections:
    - id: b-definition
      title: 01 / 定义：可组合的 Agent 平台
      from: amazon_detail
      heading: 结论与研究范围
    - id: b-seven
      title: 02 / 七层：服务清单与架构维度
      from: amazon_detail
      heading: “七层”实际上对应两种不同表述
    - id: b-flow
      title: 03 / 架构：一次调用如何穿过平台
      from: amazon_detail
      heading: 一次请求如何执行
      mode: flow
      diagram: aws
      steps_note: 来自调研文档的典型调用解释，未进行部署实测。
      step_highlights:
        '1':
        - harness
        - userapp
        - runtime
        '2':
        - caller
        - endpoint
        - runtime
        '3':
        - harness
        - userapp
        - model
        - tools
        - gateway
        '4':
        - tools
        - observability
        '5':
        - runtime
        - endpoint
        - caller
    - id: b-config
      title: 04 / 定制：托管循环与自带代码
      from: amazon_detail
      heading: 两种定制入口
    - id: b-host
      title: 05 / 托管：企业平台的责任边界
      from: amazon_detail
      heading: 企业托管责任
  sources_folds:
  - label: 阿里云官方证据与参考来源
    from: alibaba_detail
    heading: 参考来源
  - label: Amazon 官方证据与参考来源
    from: amazon_detail
    heading: 参考来源
